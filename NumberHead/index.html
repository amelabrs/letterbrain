<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#F4EDDF">
  <title>NumberHead</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ── Home ────────────────────────────────────────────────────── -->
  <div id="start-screen" class="screen active">
    <header>
      <div class="header-title">NumberHead</div>
      <div class="score">⭐ <span id="stars">0</span></div>
    </header>
    <div id="level-grid"></div>
  </div>

  <!-- ── Quiz ────────────────────────────────────────────────────── -->
  <div id="quiz-screen" class="screen">
    <button class="back-btn" onclick="goHome()">←</button>
    <div id="zone-label" class="zone-label-chip"></div>
    <div id="letter-display"></div>
    <div id="choices"></div>
    <div id="progress">
      <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
    </div>
  </div>

  <!-- ── Feedback overlay ─────────────────────────────────────────── -->
  <div id="feedback" class="feedback hidden">
    <div id="feedback-emoji"></div>
    <div id="feedback-text"></div>
  </div>

  <!-- ── Done ────────────────────────────────────────────────────── -->
  <div id="done-screen" class="screen">
    <div class="big-emoji">🎉</div>
    <h2 id="done-title">Great job!</h2>
    <p><span id="done-score">0</span> / <span id="done-total">0</span></p>
    <div id="done-stars" style="font-size:2rem;letter-spacing:6px;margin:8px 0"></div>
    <button class="home-btn" onclick="goHome()">← Home</button>
  </div>

  <!-- Confetti canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- ── Video overlay (zones 3–4 and 5–6) ───────────────────────── -->
  <div id="video-overlay" class="video-overlay hidden">
    <video id="vid"
      src="../videos/number song.mp4"
      preload="none"
      playsinline
      webkit-playsinline>
    </video>
    <button class="vid-skip-btn" onclick="skipClip()">Skip ›</button>
  </div>

</div>
<script src="app.js?v=1"></script>
</body>
</html>
