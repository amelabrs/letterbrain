<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#23272F">
    <title>LetterBrain — ABC for Kids</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;700&family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header>
            <div class="header-title">My Levels</div>
            <div class="header-right">
                <div class="score">⭐ <span id="stars">0</span></div>
                <button id="settings-btn" class="settings-icon" title="Settings">⚙️</button>
            </div>
        </header>

        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <div id="mode-tabs">
                <button id="tab-quiz" class="mode-tab mode-tab-quiz active" title="Quiz">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-9"/><path d="M9.5 9.4c1.1.8 1.8 2.1 2 3.3-3.4.4-6.8-1.1-8-4.5a9 9 0 0 1 14 7.2c-2 .4-4.4-.4-6-2.1"/></svg>
                </button>
                <button id="tab-kannada" class="mode-tab mode-tab-kannada" title="ಕನ್ನಡ">ಅ</button>
                <button id="tab-hindi" class="mode-tab mode-tab-hindi" title="हिंदी">अ</button>
                <button id="tab-saynumbers" class="mode-tab mode-tab-numbers" title="Numbers">3</button>
                <button id="tab-words" class="mode-tab mode-tab-words" title="Words">word</button>
            </div>

            <div id="quiz-case-toggle" class="segmented-toggle">
                <button id="toggle-lowercase" class="segmented-btn" data-mode="lowercase">abc</button>
                <button id="toggle-quiz" class="segmented-btn active" data-mode="quiz">ABC</button>
                <button id="toggle-case" class="segmented-btn" data-mode="matchcaps">Case</button>
            </div>

            <div id="word-family-toggle" class="segmented-toggle" style="display:none">
                <button id="toggle-words-at" class="segmented-btn active" data-mode="words">AT</button>
                <button id="toggle-words-am" class="segmented-btn" data-mode="words-am">AM</button>
                <button id="toggle-words-an" class="segmented-btn" data-mode="words-an">AN</button>
                <button id="toggle-words-ap" class="segmented-btn" data-mode="words-ap">AP</button>
                <button id="toggle-words-ag" class="segmented-btn" data-mode="words-ag">AG</button>
            </div>

            <div id="homework-banner" class="homework-banner" onclick="openHomeworkSetup()">🏠 Homework Mode — tap to set what's been learned</div>

            <div id="mode-legend"></div>
            <div id="level-grid"></div>

            <div class="settings">
                <label class="toggle-label">
                    <input type="checkbox" id="song-mode-toggle" checked>
                    <span>🎵 Song mode</span>
                </label>
                <label class="toggle-label">
                    <input type="checkbox" id="phonetics-real-toggle">
                    <span>🔬 Phonetics</span>
                </label>
                <label class="toggle-label">
                    <input type="checkbox" id="video-before-toggle">
                    <span>▶ Video before question</span>
                </label>
                <label class="toggle-label">
                    <input type="checkbox" id="no-video-toggle">
                    <span>🚫 No Videos</span>
                </label>
                <div class="theme-row">
                <button class="theme-btn active" data-theme="chalkboard" onclick="applyTheme('chalkboard')">🌙 Chalkboard</button>
                <button class="theme-btn" data-theme="rainbow" onclick="applyTheme('rainbow')">🌿 Rainbow</button>
            </div>
            <button class="log-btn" onclick="showSpeechLog()">🎙️ Speech Log</button>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen">
            <button class="back-btn" onclick="showScreen('start-screen')" aria-label="Home">←</button>
            <div id="mode-chip" class="mode-chip"></div>
            <div id="letter-display">
                <div class="letter-label">What starts with</div>
                <div id="big-letter">A</div>
                <div class="letter-label">?</div>
            </div>
            <div id="choices"></div>
            <div id="progress">
                <span id="round-info">1 / 6</span>
                <div class="progress-track">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>
        </div>

        <!-- Feedback Overlay -->
        <div id="feedback" class="feedback hidden">
            <div id="feedback-emoji"></div>
            <div id="feedback-text"></div>
        </div>

        <!-- Video Reward Overlay -->
        <div id="video-overlay" class="video-overlay hidden">
            <div class="video-wrap">
                <div id="yt-player"></div>
                <video id="local-player" style="display:none; width:100%; height:100%; object-fit:contain;" playsinline></video>
            </div>
            <button id="skip-cartoon" class="skip-btn" onclick="skipCartoon()">Skip ✖</button>
        </div>

        <!-- Shorts Reward Overlay -->
        <div id="shorts-overlay" class="video-overlay hidden">
            <div class="video-wrap shorts-wrap">
                <iframe id="shorts-iframe" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <button class="skip-btn" onclick="skipShorts()">Done ✖</button>
        </div>

        <!-- Celebration Banner -->
        <div id="celebration-banner" class="celebration-banner hidden" aria-hidden="true">
            <div class="banner-dot" style="background:#FFEA00;box-shadow:0 0 8px 1px #FFEA00"></div>
            <div class="banner-dot" style="background:#00E5FF;box-shadow:0 0 8px 1px #00E5FF"></div>
            <div class="banner-dot" style="background:#FF4FA3;box-shadow:0 0 8px 1px #FF4FA3"></div>
            <div class="banner-dot" style="background:#7CFF6B;box-shadow:0 0 8px 1px #7CFF6B"></div>
            <div class="banner-dot" style="background:#FF8A3D;box-shadow:0 0 8px 1px #FF8A3D"></div>
        </div>

        <!-- Homework Setup Screen -->
        <div id="homework-screen" class="screen">
            <button class="back-btn" onclick="closeHomeworkSetup()" aria-label="Home">←</button>
            <h2 class="hw-title">📚 What's been learned?</h2>
            <p class="hw-sub">Tap the last one your child has learned. Everything up to there stays open.</p>
            <div id="hw-tabs"></div>
            <button id="hw-mode-toggle" class="hw-mode-toggle-btn" onclick="toggleHomeworkModeFromSetup()"></button>
            <div id="hw-level-grid"></div>
        </div>

        <!-- Done Screen -->
        <div id="done-screen" class="screen">
            <div class="big-emoji">🎉</div>
            <h2>Amazing Job!</h2>
            <p>You got <span id="final-score">0</span> out of <span id="final-total">6</span> stars!</p>
            <div id="final-stars"></div>
            <div id="unlock-msg" class="unlock-msg" style="display:none">🌟 New Level Unlocked! 🌟</div>
            <button class="start-btn" onclick="showScreen('start-screen')">Play Again! 🔄</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@twemoji/api@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="app.js?v=81"></script>
</body>
</html>
