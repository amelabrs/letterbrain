<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LetterBrain — Video Clip Tester</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #111; color: #e8e4d4; padding: 2rem 1rem 6rem; }
  h1 { font-size: 1rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
       color: #D4940E; border-bottom: 2px solid #D4940E; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
  h2 { color: #807888; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; margin: 2rem 0 1rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem; }
  .card { background: #1c1a26; border-radius: 10px; overflow: hidden; border: 1px solid #2e2b3a; transition: border-color 0.2s; }
  .card.changed { border-color: #3DB870; }
  .card-head { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; border-bottom: 1px solid #2e2b3a; }
  .letter { font-family: "Noto Sans Kannada", "Noto Sans Devanagari", sans-serif; font-size: 2.2rem; line-height: 1; }
  .meta { font-size: 0.8rem; color: #807888; flex: 1; }
  .meta strong { color: #e8e4d4; display: block; }
  .embed-wrap { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
  .embed-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
  .null-note { padding: 1rem; font-size: 0.8rem; color: #E0604A; font-style: italic; }
  .ts-row {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.5rem 0.75rem; border-top: 1px solid #2e2b3a;
  }
  .ts-label { font-size: 0.7rem; color: #807888; white-space: nowrap; }
  .ts-input {
    width: 5rem; padding: 0.25rem 0.4rem; font-size: 0.8rem;
    background: #0d0c14; border: 1px solid #3e3a4e; border-radius: 4px;
    color: #e8e4d4; font-family: monospace; text-align: center;
  }
  .ts-input:focus { outline: none; border-color: #D4940E; }
  .ts-input.dirty { border-color: #3DB870; background: #0d1f14; }
  .reload-btn {
    padding: 0.25rem 0.6rem; font-size: 0.72rem; border-radius: 4px;
    border: 1px solid #3DB870; background: none; color: #3DB870; cursor: pointer;
  }
  .reload-btn:hover { background: #3DB870; color: #111; }
  .yt-link { font-size: 0.7rem; color: #807888; text-decoration: none; margin-left: auto; }
  .yt-link:hover { color: #D4940E; }

  /* floating copy button */
  #copy-btn {
    position: fixed; top: 1.5rem; right: 1.5rem;
    background: #D4940E; color: #111; border: none; border-radius: 8px;
    padding: 0.75rem 1.25rem; font-size: 0.85rem; font-weight: 700;
    cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  #copy-btn:hover { background: #e8a820; }
  #toast {
    position: fixed; top: 5rem; right: 1.5rem;
    background: #3DB870; color: #fff; border-radius: 6px;
    padding: 0.5rem 1rem; font-size: 0.8rem; opacity: 0;
    transition: opacity 0.3s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<h1>Kannada — Video Clip Tester</h1>
<h2>Vowels</h2>
<div class="grid" id="grid-vowels"></div>
<h2>Consonants <span style="font-size:0.65rem;color:#E0604A">(some timestamps estimated)</span></h2>
<div class="grid" id="grid-consonants"></div>

<h1 style="margin-top:3rem">Hindi Consonants — Video Clip Tester</h1>

<h1 style="margin-top:3rem">Lowercase English — Video Clip Tester</h1>
<div class="grid" id="grid-lowercase"></div>

<h1 style="margin-top:3rem">Cursive Letters — Video Clip Tester <span style="font-size:0.65rem;color:#E0604A">(local file)</span></h1>
<div class="grid" id="grid-cursive"></div>

<button id="copy-btn" onclick="copyChanges()">📋 Copy corrections</button>
<div id="toast">Copied!</div>

const LOWERCASE_EN = [

  { letter:"s", roman:"School",    vidStart:612 },
  { letter:"t", roman:"Tiger",     vidStart:642 },
  { letter:"u", roman:"Umbrella",  vidStart:677 },
  { letter:"v", roman:"Van",       vidStart:721 },
  { letter:"w", roman:"Watch",     vidStart:747 },
  { letter:"x", roman:"Xmas Tree", vidStart:788 },
  { letter:"y", roman:"Yacht",     vidStart:821 },
  { letter:"z", roman:"Zebra",     vidStart:847 },

// track all changes: key = "section:roman", value = new seconds
const changes = {};

function toSeconds(val) {
  val = val.trim();
  if (!val || val === '-') return null;
  if (val.includes(':')) {
    const [m, s] = val.split(':').map(Number);
    return m * 60 + s;
  }
  return parseInt(val, 10) || null;
}

function toMMSS(sec) {
  if (sec === null) return '';
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function reloadEmbed(card, iframe, sec, videoId) {
  if (sec === null) return;
  const end = sec + CLIP_DUR;
  iframe.src = `https://www.youtube.com/embed/${videoId}?start=${sec}&end=${end}&autoplay=1&rel=0&modestbranding=1`;
}

function buildGrid(items, gridId, videoId, section, clipDur = CLIP_DUR) {
  const grid = document.getElementById(gridId);
  items.forEach(({ letter, roman, vidStart }) => {
    const card = document.createElement("div");
    card.className = "card";

    const safeRoman = roman.replace(/\s+/g, "_");
    const embedId = `embed-${section}-${safeRoman}`;
    const inputId = `inp-${section}-${safeRoman}`;
    const end = vidStart !== null ? vidStart + clipDur : null;
    const ytUrl = vidStart !== null
      ? `https://youtu.be/${videoId}?t=${vidStart}`
      : `https://www.youtube.com/watch?v=${videoId}`;

    card.innerHTML = `
      <div class="card-head">
        <div class="letter">${letter}</div>
        <div class="meta"><strong>${roman}</strong></div>
        <a class="yt-link" href="${ytUrl}" target="_blank">↗ YT</a>
      </div>
      ${vidStart !== null
        ? `<div class="embed-wrap">
             <iframe id="${embedId}"
               src="https://www.youtube.com/embed/${videoId}?start=${vidStart}&end=${end}&autoplay=0&rel=0&modestbranding=1"
               allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
               allowfullscreen></iframe>
           </div>`
        : `<div class="null-note">no timestamp</div>`
      }
      <div class="ts-row">
        <span class="ts-label">timestamp</span>
        <input id="${inputId}" class="ts-input" type="text"
          value="${vidStart !== null ? toMMSS(vidStart) : ''}"
          placeholder="m:ss or –">
        <button class="reload-btn" onclick="applyChange('${section}','${roman}','${embedId}','${inputId}','${videoId}',this.closest('.card'))">▶ Apply</button>
      </div>
    `;

    // also trigger on Enter
    card.querySelector(`#${inputId}`).addEventListener('keydown', e => {
      if (e.key === 'Enter') card.querySelector('.reload-btn').click();
    });

    grid.appendChild(card);
  });
}

function applyChange(section, roman, embedId, inputId, videoId, card) {
  const input = document.getElementById(inputId);
  const sec = toSeconds(input.value);
  const key = `${section}:${roman}`;
  changes[key] = { roman, section, sec };
  input.classList.add('dirty');
  card.classList.add('changed');

  const iframe = document.getElementById(embedId);
  if (iframe && sec !== null) {
    reloadEmbed(card, iframe, sec, videoId);
  } else if (!iframe && sec === null) {
    // stays null
  } else if (iframe && sec === null) {
    iframe.src = 'about:blank';
  }
}

function copyChanges() {
  const lines = Object.values(changes).map(({ roman, section, sec }) =>
    `${section} | ${roman} | ${sec !== null ? toMMSS(sec) + ' (' + sec + 's)' : 'null'}`
  );
  const text = '--- Timestamp corrections ---\n' + lines.join('\n');
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  });
}

buildGrid(VOWELS,      "grid-vowels",     KN_VIDEO, "kn-vowel");
buildGrid(CONSONANTS,  "grid-consonants", KN_VIDEO, "kn-cons");
buildGrid(HINDI,       "grid-hindi",      HI_VIDEO, "hi-cons");
buildGrid(LOWERCASE_EN,"grid-lowercase",  LC_VIDEO, "en-lower", 6);

// ── Cursive local-video section — uses pre-extracted clips (no seeking) ──
const CURSIVE_LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const CURSIVE_STARTS  = {
  A:12,  B:29,  C:48,  D:64,  E:86,  F:104,
  G:125, H:144, I:161, J:178, K:196, L:220,
  M:240, N:262, O:282, P:303, Q:323, R:344,
  S:364, T:385, U:407, V:431, W:458, X:482,
  Y:506, Z:532
};

function buildCursiveGrid() {
  const grid = document.getElementById("grid-cursive");
  CURSIVE_LETTERS.forEach(letter => {
    const vidId   = `cursive-vid-${letter}`;
    const inputId = `cursive-inp-${letter}`;
    const src     = `videos/cursive_clips/${letter}.mp4`;
    const start   = CURSIVE_STARTS[letter];
    const card    = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-head">
        <div class="letter" style="font-family:Georgia,serif;font-style:italic;font-size:2.2rem">${letter}</div>
        <div class="meta"><strong>${letter} — cursive</strong></div>
        <a class="yt-link" href="${src}" target="_blank">↗ file</a>
      </div>
      <div class="embed-wrap">
        <video id="${vidId}" src="${src}" preload="metadata" controls
          style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000">
        </video>
      </div>
      <div class="ts-row">
        <span class="ts-label">start (s)</span>
        <input id="${inputId}" class="ts-input" type="number" value="${start}" min="0" max="570" step="1">
        <button class="reload-btn" onclick="applyCursiveChange('${letter}','${inputId}',this.closest('.card'))">▶ Apply</button>
      </div>
    `;
    card.querySelector(`#${inputId}`).addEventListener("keydown", e => {
      if (e.key === "Enter") card.querySelector(".reload-btn").click();
    });
    grid.appendChild(card);
  });
}

function applyCursiveChange(letter, inputId, card) {
  const val = parseInt(document.getElementById(inputId).value, 10);
  if (isNaN(val)) return;
  document.getElementById(inputId).classList.add("dirty");
  card.classList.add("changed");
  // Record correction for the Copy button
  changes[`cursive:${letter}`] = { roman: letter, section: "cursive", sec: val };
}

buildCursiveGrid();
</script>

</html>
