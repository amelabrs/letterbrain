<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hindi Vowel Audio Timestamps</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
h1 { color: #A78BFA; margin-bottom: 16px; font-size: 1.3rem; }

audio { width: 100%; max-width: 680px; margin-bottom: 8px; }
#time-display { font-size: 1.4rem; color: #A78BFA; margin-bottom: 16px; }

.vowel-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 8px;
  max-width: 680px;
  margin-bottom: 20px;
}
.vowel-btn {
  background: #2d2d4e; border: 2px solid #444; border-radius: 8px;
  color: #e0e0e0; padding: 10px 6px; cursor: pointer; text-align: center;
  transition: background 0.15s;
}
.vowel-btn:hover { background: #3d3d6e; border-color: #A78BFA; }
.vowel-btn.marked { border-color: #7CFF6B; background: #1a3a1a; }
.vowel-btn .big { font-size: 1.5rem; font-family: serif; display: block; }
.vowel-btn .roman { font-size: 0.7rem; color: #999; }
.vowel-btn .ts { font-size: 0.85rem; color: #7CFF6B; margin-top: 4px; display: block; }

.controls { max-width: 680px; display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.ctrl-btn {
  background: #2d2d4e; border: 1px solid #555; border-radius: 6px;
  color: #e0e0e0; padding: 6px 14px; cursor: pointer; font-family: monospace;
}
.ctrl-btn:hover { background: #3d3d6e; }

#output-box {
  max-width: 680px; background: #0f1e0f; border-radius: 8px;
  padding: 14px; font-size: 0.8rem; color: #7CFF6B;
  white-space: pre; overflow-x: auto; border: 1px solid #2a4a2a;
  min-height: 60px;
}
#copy-btn {
  margin-top: 8px; background: #2d2d4e; border: 1px solid #555; border-radius: 6px;
  color: #e0e0e0; padding: 5px 14px; cursor: pointer; font-family: monospace;
}
p.hint { max-width: 680px; font-size: 0.78rem; color: #888; margin-bottom: 14px; }
</style>
</head>
<body>
<h1>🎵 Hindi Vowel Audio — Timestamp Finder</h1>
<p class="hint">Play the audio, then tap each vowel button at the moment it starts. The current time is marked automatically.</p>

<audio id="aud" controls src="audio/%E0%A4%85%20%E0%A4%86%20%E0%A4%87%20%E0%A4%88%20%E0%A5%A4%20%E0%A4%B9%E0%A4%BF%E0%A4%A8%E0%A5%8D%E0%A4%A6%E0%A5%80%20%E0%A4%B8%E0%A5%8D%E0%A4%B5%E0%A4%B0%E0%A5%A4%20hindi%20alphabets%20easy%20hindi%20reading%20class%20%23hindireading%20%23learnhindimatra.mp3"></audio>
<div id="time-display">0.0s</div>

<div class="controls">
  <button class="ctrl-btn" onclick="aud.currentTime = Math.max(0, aud.currentTime - 2)">◀ -2s</button>
  <button class="ctrl-btn" onclick="aud.currentTime = Math.max(0, aud.currentTime - 0.5)">◀ -0.5s</button>
  <button class="ctrl-btn" onclick="aud.currentTime += 0.5">+0.5s ▶</button>
  <button class="ctrl-btn" onclick="aud.currentTime += 2">+2s ▶</button>
</div>

<div class="vowel-grid" id="vowel-grid"></div>

<div id="output-box">— tap the vowels to mark timestamps —</div>
<button id="copy-btn" onclick="copyOutput()">📋 Copy for app.js</button>

<script>
const VOWELS = [
  { letter:"अ",  roman:"a"  },
  { letter:"आ",  roman:"aa" },
  { letter:"इ",  roman:"i"  },
  { letter:"ई",  roman:"ii" },
  { letter:"उ",  roman:"u"  },
  { letter:"ऊ",  roman:"uu" },
  { letter:"ऋ",  roman:"ru" },
  { letter:"ए",  roman:"e"  },
  { letter:"ऐ",  roman:"ai" },
  { letter:"ओ",  roman:"o"  },
  { letter:"औ",  roman:"au" },
  { letter:"अं", roman:"am" },
];

const aud = document.getElementById("aud");
const timestamps = {};

aud.addEventListener("timeupdate", () => {
  document.getElementById("time-display").textContent = aud.currentTime.toFixed(1) + "s";
});

const grid = document.getElementById("vowel-grid");
VOWELS.forEach(({ letter, roman }) => {
  const btn = document.createElement("button");
  btn.className = "vowel-btn";
  btn.id = "btn-" + roman;
  btn.innerHTML = `<span class="big">${letter}</span><span class="roman">${roman}</span><span class="ts" id="ts-${roman}">—</span>`;
  btn.onclick = () => {
    const t = Math.round(aud.currentTime);
    timestamps[roman] = t;
    document.getElementById("ts-" + roman).textContent = t + "s";
    btn.classList.add("marked");
    renderOutput();
  };
  grid.appendChild(btn);
});

function renderOutput() {
  const lines = VOWELS.map(({ letter, roman }) => {
    const t = timestamps[roman] ?? "?";
    return `  { letter:"${letter}", roman:"${roman}", vidStart:${t} },`;
  });
  document.getElementById("output-box").textContent =
    "// Hindi vowels — paste into video-test.html HINDI_VOWELS\nconst HINDI_VOWELS = [\n" + lines.join("\n") + "\n];";
}

function copyOutput() {
  navigator.clipboard.writeText(document.getElementById("output-box").textContent).then(() => {
    const btn = document.getElementById("copy-btn");
    btn.textContent = "✅ Copied!";
    setTimeout(() => btn.textContent = "📋 Copy for app.js", 2000);
  });
}
</script>
</body>
</html>
