<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LetterBrain — Audio Clip Tester</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #111; color: #e8e4d4; padding: 2rem 1rem 6rem; }
  h1 { font-size: 1rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
       color: #D4940E; border-bottom: 2px solid #D4940E; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
  h2 { color: #807888; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; margin: 2rem 0 1rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
  .card {
    background: #1c1a26; border-radius: 10px; padding: 1rem;
    border: 2px solid #2e2b3a; display: flex; flex-direction: column;
    align-items: center; gap: 0.6rem; transition: border-color 0.2s;
    cursor: pointer; user-select: none;
  }
  .card:hover { border-color: #D4940E; }
  .card.playing { border-color: #3DB870; background: #0d1f14; }
  .card.flagged { border-color: #E0604A; background: #1f0d0d; }
  .letter {
    font-family: "Noto Sans Devanagari", "Noto Sans Kannada", sans-serif;
    font-size: 2.5rem; line-height: 1;
  }
  .roman { font-size: 0.75rem; color: #807888; font-family: monospace; }
  .file  { font-size: 0.65rem; color: #4a4560; font-family: monospace; }
  .play-btn {
    width: 2.2rem; height: 2.2rem; border-radius: 50%;
    border: 1.5px solid #3DB870; background: none; color: #3DB870;
    font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .play-btn:hover { background: #3DB870; color: #111; }
  .flag-btn {
    font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 4px;
    border: 1px solid #E0604A; background: none; color: #E0604A; cursor: pointer;
  }
  .card.flagged .flag-btn { background: #E0604A; color: #fff; }
  .note-input {
    width: 100%; font-size: 0.7rem; padding: 0.25rem 0.4rem; border-radius: 4px;
    background: #0d0c14; border: 1px solid #3e3a4e; color: #e8e4d4;
    font-family: monospace; display: none;
  }
  .card.flagged .note-input { display: block; }

  #copy-btn {
    position: fixed; top: 1.5rem; right: 1.5rem;
    background: #D4940E; color: #111; border: none; border-radius: 8px;
    padding: 0.75rem 1.25rem; font-size: 0.85rem; font-weight: 700;
    cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  #copy-btn:hover { background: #e8a820; }
  #toast {
    position: fixed; top: 5rem; right: 1.5rem;
    background: #3DB870; color: #fff; border-radius: 6px;
    padding: 0.5rem 1rem; font-size: 0.8rem; opacity: 0;
    transition: opacity 0.3s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  .legend {
    font-size: 0.72rem; color: #807888; margin-bottom: 0.5rem;
  }
  .legend span { margin-right: 1rem; }
  .legend .ok  { color: #3DB870; }
  .legend .bad { color: #E0604A; }
</style>
</head>
<body>

<h1>Hindi Consonants — Audio Tester</h1>
<p class="legend">
  <span>Click card or ▶ to play.</span>
  <span class="bad">Flag ✗</span><span> = wrong clip — add a note.</span>
  <span class="ok">Green border</span><span> = playing.</span>
</p>

<h2>ka-varga</h2>
<div class="grid" id="g-ka"></div>

<h2>cha-varga</h2>
<div class="grid" id="g-cha"></div>

<h2>ta-varga — retroflex</h2>
<div class="grid" id="g-ret"></div>

<h2>ta-varga — dental</h2>
<div class="grid" id="g-den"></div>

<h2>pa-varga</h2>
<div class="grid" id="g-pa"></div>

<h2>antastha + ushma + ha</h2>
<div class="grid" id="g-rest"></div>

<button id="copy-btn" onclick="copyFlags()">📋 Copy flagged</button>
<div id="toast">Copied!</div>

<script>
const GROUPS = {
  "g-ka":   [
    { letter:"क", roman:"ka",   file:"audio/hindi/ka.mp3"   },
    { letter:"ख", roman:"kha",  file:"audio/hindi/kha.mp3"  },
    { letter:"ग", roman:"ga",   file:"audio/hindi/ga.mp3"   },
    { letter:"घ", roman:"gha",  file:"audio/hindi/gha.mp3"  },
    { letter:"ङ", roman:"nga",  file:"audio/hindi/nga.mp3"  },
  ],
  "g-cha":  [
    { letter:"च", roman:"cha",  file:"audio/hindi/cha.mp3"  },
    { letter:"छ", roman:"chha", file:"audio/hindi/chha.mp3" },
    { letter:"ज", roman:"ja",   file:"audio/hindi/ja.mp3"   },
    { letter:"झ", roman:"jha",  file:"audio/hindi/jha.mp3"  },
    { letter:"ञ", roman:"nya",  file:"audio/hindi/nya.mp3"  },
  ],
  "g-ret":  [
    { letter:"ट", roman:"Ta",   file:"audio/hindi/ta2.mp3"  },
    { letter:"ठ", roman:"Tha",  file:"audio/hindi/tha2.mp3" },
    { letter:"ड", roman:"Da",   file:"audio/hindi/da2.mp3"  },
    { letter:"ढ", roman:"Dha",  file:"audio/hindi/dha2.mp3" },
    { letter:"ण", roman:"Na",   file:"audio/hindi/na2.mp3"  },
  ],
  "g-den":  [
    { letter:"त", roman:"ta",   file:"audio/hindi/ta.mp3"   },
    { letter:"थ", roman:"tha",  file:"audio/hindi/tha.mp3"  },
    { letter:"द", roman:"da",   file:"audio/hindi/da.mp3"   },
    { letter:"ध", roman:"dha",  file:"audio/hindi/dha.mp3"  },
    { letter:"न", roman:"na",   file:"audio/hindi/na.mp3"   },
  ],
  "g-pa":   [
    { letter:"प", roman:"pa",   file:"audio/hindi/pa.mp3"   },
    { letter:"फ", roman:"pha",  file:"audio/hindi/pha.mp3"  },
    { letter:"ब", roman:"ba",   file:"audio/hindi/ba.mp3"   },
    { letter:"भ", roman:"bha",  file:"audio/hindi/bha.mp3"  },
    { letter:"म", roman:"ma",   file:"audio/hindi/ma.mp3"   },
  ],
  "g-rest": [
    { letter:"य", roman:"ya",   file:"audio/hindi/ya.mp3"   },
    { letter:"र", roman:"ra",   file:"audio/hindi/ra.mp3"   },
    { letter:"ल", roman:"la",   file:"audio/hindi/la.mp3"   },
    { letter:"व", roman:"va",   file:"audio/hindi/va.mp3"   },
    { letter:"श", roman:"sha",  file:"audio/hindi/sha.mp3"  },
    { letter:"ष", roman:"Sha",  file:"audio/hindi/sha2.mp3" },
    { letter:"स", roman:"sa",   file:"audio/hindi/sa.mp3"   },
    { letter:"ह", roman:"ha",   file:"audio/hindi/ha.mp3"   },
  ],
};

const flags = {};
let currentAudio = null;

function play(file, card) {
  if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
  document.querySelectorAll('.card.playing').forEach(c => c.classList.remove('playing'));
  const audio = new Audio(file);
  currentAudio = audio;
  card.classList.add('playing');
  audio.play();
  audio.onended = () => card.classList.remove('playing');
}

function toggleFlag(roman, card, noteEl) {
  if (flags[roman]) {
    delete flags[roman];
    card.classList.remove('flagged');
  } else {
    flags[roman] = { roman, note: '' };
    card.classList.add('flagged');
    noteEl.focus();
  }
}

function buildGroup(gridId, items) {
  const grid = document.getElementById(gridId);
  items.forEach(({ letter, roman, file }) => {
    const card = document.createElement('div');
    card.className = 'card';

    const noteEl = document.createElement('input');
    noteEl.className = 'note-input';
    noteEl.placeholder = 'describe problem…';
    noteEl.addEventListener('input', () => {
      if (flags[roman]) flags[roman].note = noteEl.value;
    });

    card.innerHTML = `
      <div class="letter">${letter}</div>
      <div class="roman">${roman}</div>
      <div class="file">${file.split('/').pop()}</div>
      <button class="play-btn" title="Play">▶</button>
      <button class="flag-btn">✗ Flag</button>
    `;
    card.appendChild(noteEl);

    card.querySelector('.play-btn').addEventListener('click', e => {
      e.stopPropagation();
      play(file, card);
    });
    card.querySelector('.flag-btn').addEventListener('click', e => {
      e.stopPropagation();
      toggleFlag(roman, card, noteEl);
    });
    card.addEventListener('click', () => play(file, card));

    grid.appendChild(card);
  });
}

Object.entries(GROUPS).forEach(([id, items]) => buildGroup(id, items));

function copyFlags() {
  const lines = Object.values(flags).map(({ roman, note }) =>
    `hi-audio | ${roman}${note ? ' | ' + note : ''}`
  );
  const text = lines.length
    ? '--- Audio flags ---\n' + lines.join('\n')
    : '(nothing flagged)';
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  });
}
</script>
</body>
</html>
