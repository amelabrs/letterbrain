<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LetterBrain — Image Tester</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #111; color: #e8e4d4; padding: 2rem 1rem 4rem; }
  h1 { font-size: 1rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
       color: #D4940E; border-bottom: 2px solid #D4940E; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
  h2 { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
       color: #807888; margin: 2rem 0 1rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 0.9rem; }
  .card {
    background: #1c1a26; border-radius: 10px; overflow: hidden;
    border: 2px solid #2e2b3a; display: flex; flex-direction: column;
    align-items: center; padding: 0.75rem 0.5rem 0.5rem;
  }
  .card.warn    { border-color: #E0604A; }
  .card.dup     { border-color: #D4940E; }
  .card.unused  { border-color: #2e2b3a; opacity: 0.7; }
  .letter { font-family: "Noto Sans Kannada", "Noto Sans Devanagari", sans-serif;
            font-size: 2rem; line-height: 1; margin-bottom: 0.2rem; }
  .roman  { font-size: 0.7rem; color: #807888; margin-bottom: 0.5rem; font-family: monospace; }
  .img-wrap {
    width: 90px; height: 90px; display: flex; align-items: center; justify-content: center;
    background: #fff; border-radius: 6px; overflow: hidden;
  }
  .img-wrap img { width: 100%; height: 100%; object-fit: contain; }
  .img-null {
    width: 90px; height: 90px; display: flex; align-items: center; justify-content: center;
    background: #2e2b3a; border-radius: 6px; font-size: 0.68rem; color: #E0604A; text-align: center;
  }
  .note { font-size: 0.6rem; color: #E0604A; margin-top: 0.35rem; text-align: center; line-height: 1.3; }
  .note.amber { color: #D4940E; }
  .note.green { color: #3DB870; }
  .filename { font-size: 0.6rem; color: #3e3a4e; margin-top: 0.25rem; font-family: monospace; word-break: break-all; text-align: center; }
  .unused-img-wrap {
    width: 90px; height: 90px; display: flex; align-items: center; justify-content: center;
    background: #fff; border-radius: 6px; overflow: hidden;
  }
  .unused-img-wrap img { width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>

<h2>Kannada Vowels</h2>
<div class="grid" id="kn-vowels"></div>

<h2>Kannada Consonants</h2>
<div class="grid" id="kn-cons"></div>

<div class="grid" id="hi-cons"></div>

<h2>Lowercase English</h2>

<h2>Images in folder — not yet assigned</h2>

// All images known to exist in /images/
const ALL_IMAGES = [
  "apple.png","arrow.png","ball.png","bat.jpg","bell.png","bug.png","bun.png","bus.png",
  "camel.png","can.png","cat.png","clock.png","color.png","conch.png","cow.png","crab.png",

  "joker.png","jug.png","jungle.png","king.png","kite.png","laddoo.png","leaf.png","lion.png","log.png",

];

// Collect all assigned images (normalise to filename only)
const allItems = [...KN_VOWELS, ...KN_CONS, ...HI_CONS, ...LOWERCASE_EN];
const usageCounts = {};
allItems.forEach(({ image }) => {
  if (!image) return;
  const f = image.replace("images/", "");
  usageCounts[f] = (usageCounts[f] || 0) + 1;
});

function buildGrid(items, gridId) {
  const grid = document.getElementById(gridId);
  items.forEach(({ letter, roman, image }) => {
    const filename = image ? image.replace("images/", "") : null;
    const dupCount = filename ? usageCounts[filename] : 0;
    const isDup = dupCount > 1;

    const card = document.createElement("div");
    card.className = "card" + (isDup ? " dup" : "");

    card.innerHTML = `
      <div class="letter">${letter}</div>
      <div class="roman">${roman}</div>
      ${image
        ? `<div class="img-wrap"><img src="${image}" alt="${roman}"
             onerror="this.parentNode.innerHTML='<span style=color:#E0604A;font-size:0.68rem>missing</span>'"></div>`
        : `<div class="img-null">no image</div>`
      }
      ${isDup ? `<div class="note amber">shared × ${dupCount}</div>` : ""}
      ${filename ? `<div class="filename">${filename}</div>` : ""}
    `;
    grid.appendChild(card);
  });
}

function buildUnused() {
  const grid = document.getElementById("unused");
  const skip = new Set(["icon-192.png","icon-512.png"]);
  ALL_IMAGES.forEach(f => {
    if (skip.has(f) || usageCounts[f]) return;
    const card = document.createElement("div");
    card.className = "card unused";
    card.innerHTML = `
      <div class="unused-img-wrap">
        <img src="images/${f}" alt="${f}"
          onerror="this.parentNode.innerHTML='<span style=color:#E0604A;font-size:0.68rem>missing</span>'">
      </div>
      <div class="filename">${f}</div>
    `;
    grid.appendChild(card);
  });
}

buildGrid(KN_VOWELS,   "kn-vowels");
buildGrid(KN_CONS,     "kn-cons");
buildGrid(HI_CONS,     "hi-cons");
buildGrid(LOWERCASE_EN,"en-lower");
buildUnused();
</script>
